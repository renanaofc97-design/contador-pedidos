<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos — Dona Feijuca</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top right, #7a1d2b 0%, transparent 35%),
    radial-gradient(circle at bottom left, #3d0710 0%, transparent 40%),
    #520d18;
  color:#fff;
  min-height:100vh;
}

/* CABEÇALHO */

header{
  padding:24px 32px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:15px;
  background:rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

h1{
  margin:0;
  font-size:28px;
  font-weight:800;
  letter-spacing:-.5px;
}

.subtitle{
  margin-top:4px;
  font-size:13px;
  opacity:.6;
}

.right-header{
  display:flex;
  align-items:center;
  gap:24px;
}

.clock{
  font-size:25px;
  font-weight:700;
  letter-spacing:1px;
}

.online{
  font-size:13px;
  padding:9px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.10);
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  padding:10px 32px 24px;
}

.card{
  position:relative;
  overflow:hidden;
  background:rgba(20,10,12,.72);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:22px 24px;
  min-height:155px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 10px 35px rgba(0,0,0,.20);
  backdrop-filter:blur(8px);
  transition:.2s;
}

.card::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  right:-35px;
  bottom:-45px;
  border-radius:50%;
  background:currentColor;
  opacity:.07;
}

.label{
  font-size:16px;
  font-weight:600;
  opacity:.75;
}

.num{
  font-size:68px;
  font-weight:900;
  line-height:1;
  margin-top:12px;
}

/* CORES */

.aguardando{
  border-top:4px solid #f1c40f;
}

.preparo{
  border-top:4px solid #f39c12;
}

.prontos{
  border-top:4px solid #2ecc71;
}

.entrega{
  border-top:4px solid #3498db;
}

.entregues{
  border-top:4px solid #9b59b6;
}

.total{
  border-top:4px solid #fff;
}

/* PAINEL */

section{
  padding:0 32px 30px;
}

.panel{
  background:rgba(20,10,12,.72);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:22px 24px;
  box-shadow:0 10px 35px rgba(0,0,0,.20);
  backdrop-filter:blur(8px);
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

h2{
  margin:0;
  font-size:20px;
}

.panel-info{
  font-size:13px;
  opacity:.5;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:1px;
  opacity:.45;
}

th,td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

td{
  font-size:14px;
}

.pill{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.10);
  font-size:12px;
  font-weight:600;
}

/* RESPONSIVO */

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  header{
    padding:18px;
  }

  .grid{
    grid-template-columns:1fr;
    padding:10px 18px 20px;
  }

  section{
    padding:0 18px 20px;
  }

  .clock{
    display:none;
  }

  h1{
    font-size:22px;
  }

  .num{
    font-size:60px;
  }

}
</style>
</head>

<body>

<header>

  <div class="brand">

    <div class="logo">🍛</div>

    <div>
      <h1>Dona Feijuca</h1>
      <div class="subtitle">Painel de pedidos</div>
    </div>

  </div>

  <div class="right-header">

    <div class="clock" id="clock">00:00</div>

    <div class="online" id="conn">
      Conectando...
    </div>

  </div>

</header>


<div class="grid">

  <div class="card aguardando">

    <div class="label">🟡 Aguardando</div>

    <div class="num" id="aguardando">0</div>

  </div>


  <div class="card preparo">

    <div class="label">🟠 Em preparo</div>

    <div class="num" id="em_preparo">0</div>

  </div>


  <div class="card prontos">

    <div class="label">🟢 Prontos</div>

    <div class="num" id="prontos">0</div>

  </div>


  <div class="card entrega">

    <div class="label">🔵 Em entrega</div>

    <div class="num" id="em_entrega">0</div>

  </div>


  <div class="card entregues">

    <div class="label">🟣 Entregues hoje</div>

    <div class="num" id="entregues">0</div>

  </div>


  <div class="card total">

    <div class="label">⚪ Total de pedidos hoje</div>

    <div class="num" id="total_today">0</div>

  </div>

</div>


<section>

  <div class="panel">

    <div class="panel-title">

      <h2>Pedidos ativos</h2>

      <div class="panel-info">
        Atualização em tempo real
      </div>

    </div>

    <table>

      <thead>

        <tr>
          <th>Pedido</th>
          <th>Status</th>
          <th>Recebido</th>
        </tr>

      </thead>

      <tbody id="orders">

        <tr>
          <td colspan="3">
            Aguardando pedidos...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</section>


<script>

const labels = {

  waiting_confirmation: "Aguardando",
  pending_payment: "Aguardando",
  pending_online_payment: "Aguardando",

  confirmed: "Em preparo",
  scheduled_confirmed: "Em preparo",

  ready: "Pronto",
  waiting_to_catch: "Pronto",

  released: "Em entrega"

};


function age(iso){

  if(!iso) return "-";

  const m = Math.max(
    0,
    Math.floor(
      (Date.now() - new Date(iso).getTime()) / 60000
    )
  );

  return m < 1 ? "agora" : `${m} min`;

}


function render(data){

  const counters = data.counters || {};

  document.getElementById("aguardando").textContent =
    counters.aguardando || 0;

  document.getElementById("em_preparo").textContent =
    counters.em_preparo || 0;

  document.getElementById("prontos").textContent =
    counters.prontos || 0;

  document.getElementById("em_entrega").textContent =
    counters.em_entrega || 0;

  document.getElementById("entregues").textContent =
    counters.entregues || 0;

  document.getElementById("total_today").textContent =
    data.total_today || 0;


  const tbody =
    document.getElementById("orders");


  if(!data.active_orders){

    tbody.innerHTML =
      '<tr><td colspan="3">Pedidos sendo contabilizados...</td></tr>';

    return;

  }


  if(!data.active_orders.length){

    tbody.innerHTML =
      '<tr><td colspan="3">Nenhum pedido ativo.</td></tr>';

    return;

  }


  tbody.innerHTML =
    data.active_orders.map(o => `

      <tr>

        <td>
          <strong>#${o.display_id || o.id}</strong>
        </td>

        <td>

          <span class="pill">
            ${labels[o.status] || o.status}
          </span>

        </td>

        <td>
          ${age(o.created_at)}
        </td>

      </tr>

    `).join("");

}


/* RELÓGIO */

function updateClock(){

  const now = new Date();

  const time =
    now.toLocaleTimeString("pt-BR", {
      hour:"2-digit",
      minute:"2-digit"
    });

  document.getElementById("clock").textContent =
    time;

}

updateClock();

setInterval(updateClock,1000);


/* INICIALIZAÇÃO */

async function boot(){

  try{

    const response =
      await fetch("/api/dashboard");

    const data =
      await response.json();

    render(data);

  }catch(e){

    console.error(
      "Erro ao carregar painel:",
      e
    );

  }


  const es =
    new EventSource("/events");


  es.onopen = () => {

    document.getElementById("conn").textContent =
      "● Online — tempo real";

  };


  es.onmessage = e => {

    try{

      render(
        JSON.parse(e.data)
      );

    }catch(error){

      console.error(
        "Erro ao interpretar evento:",
        error
      );

    }

  };


  es.onerror = () => {

    document.getElementById("conn").textContent =
      "○ Reconectando...";

  };

}


boot();

</script>

</body>
</html>
