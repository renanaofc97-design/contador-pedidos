<!-- =========================================
     COMPARAÇÃO SEMANAL
========================================= -->

<section class="comparison-section">

  <div class="comparison-panel">

    <div class="comparison-header">

      <div>

        <div class="comparison-title">
          PERFORMANCE DA OPERAÇÃO
        </div>

        <div
          class="comparison-subtitle"
          id="comparison_subtitle"
        >
          Hoje × mesmo dia da semana passada
        </div>

      </div>

      <div
        class="comparison-result"
        id="comparison_result"
      >
        --
      </div>

    </div>


    <!-- RESUMO -->

    <div class="comparison-summary">

      <div class="comparison-stat">

        <div class="comparison-stat-label">
          HOJE
        </div>

        <div
          class="comparison-stat-number"
          id="comparison_today"
        >
          0
        </div>

        <div class="comparison-stat-small">
          pedidos acumulados
        </div>

      </div>


      <div class="comparison-vs">
        ×
      </div>


      <div class="comparison-stat">

        <div class="comparison-stat-label">
          SEMANA PASSADA
        </div>

        <div
          class="comparison-stat-number secondary"
          id="comparison_last_week"
        >
          0
        </div>

        <div class="comparison-stat-small">
          pedidos acumulados
        </div>

      </div>

    </div>


    <!-- GRÁFICO -->

    <div
      class="comparison-chart"
      id="comparison_chart"
    >
    </div>

  </div>

</section>
